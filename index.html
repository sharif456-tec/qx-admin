<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QX Admin Control Center</title><style>:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#11243a;--line:#1e3955;--text:#edf6ff;--muted:#8fa9c2;--accent:#49d6ff;--green:#43e6a3;--red:#ff6b7d;--amber:#ffc857;--shadow:0 18px 50px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#123452 0,transparent 35%),radial-gradient(circle at 90% 10%,#16304b 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial,sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:22px 16px;border-right:1px solid var(--line);background:#071321dd;backdrop-filter:blur(16px);position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:20px;letter-spacing:.4px;margin-bottom:26px}.brand span{color:var(--accent)}.nav button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:12px;margin:3px 0;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:#15314a;color:#fff}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.title h1{margin:0;font-size:28px}.title p{margin:5px 0;color:var(--muted)}.status{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#0b1929}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:linear-gradient(145deg,#10243a,#0a1829);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.card{padding:18px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}.value{font-size:27px;font-weight:900;margin-top:8px}.sub{color:var(--muted);font-size:12px;margin-top:5px}.panel{padding:20px;margin-top:16px}.panel h2{font-size:16px;margin:0 0 15px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #183049;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase}button.action{border:1px solid #28506f;background:#102d46;color:#fff;padding:8px 11px;border-radius:9px;cursor:pointer}.action.ok{border-color:#24785c;background:#103c31}.action.danger{border-color:#7b3040;background:#421a25}.empty{text-align:center;padding:35px;color:var(--muted)}.error{margin-top:15px;border:1px solid #8d3949;background:#351923;border-radius:14px;padding:15px;color:#ffdce2}.error strong{display:block;color:#ff91a0;margin-bottom:5px}.success{margin-top:15px;border:1px solid #287b61;background:#10352b;border-radius:14px;padding:15px;color:#d9fff1}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{width:min(600px,100%);background:#0d1b2d;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}input,select{width:100%;padding:11px 12px;background:#081625;border:1px solid #25435d;color:#fff;border-radius:10px;margin:6px 0 12px}#toast{position:fixed;right:18px;bottom:18px;z-index:30;display:none;max-width:420px;padding:14px 16px;border-radius:13px;background:#10263a;border:1px solid var(--line);box-shadow:var(--shadow)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.main{padding:15px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.title h1{font-size:23px}}</style></head><body><div class="app"><aside class="side"><div class="brand">QX <span>ADMIN</span><br><small>CONTROL CENTER</small></div><div class="nav"><button class="active" data-view="overview">◈ Overview</button><button data-view="licenses">🔑 Licenses</button><button data-view="requests">📥 Requests</button><button data-view="devices">📱 Devices</button><button data-view="telegram">✈ Telegram</button><button data-view="data">📊 Supabase Data</button><button data-view="settings">⚙ Settings</button></div></aside><main class="main"><div class="top"><div class="title"><h1 id="pageTitle">Dashboard</h1><p id="pageDesc">Live control and database overview</p></div><div class="status"><i class="dot"></i><span id="systemStatus">System online</span></div></div><section id="view"></section></main></div><div id="toast"></div><script>const V=document.getElementById('view'),T=document.getElementById('toast');let cache={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(msg,good=false){T.style.display='block';T.style.borderColor=good?'#287b61':'#8d3949';T.textContent=msg;setTimeout(()=>T.style.display='none',4500)}function explain(e){const s=String(e?.message||e||'Unknown error');let reason='The server or database rejected the operation.';if(/plan.*column|column.*plan/i.test(s))reason='The deployed backend is sending a field named plan, but the licenses table does not contain that column.';else if(/schema cache/i.test(s))reason='Supabase PostgREST has a schema/API mismatch; the deployed backend may be using an old database contract.';else if(/401|authentication|session|jwt/i.test(s))reason='Your admin login session is missing, expired, or not authorized.';else if(/403|admin access/i.test(s))reason='Your account is authenticated but does not have Admin permission.';else if(/telegram/i.test(s))reason='Telegram delivery failed; usually the user has not started the bot or no chat ID is linked.';else if(/network|fetch|failed to fetch/i.test(s))reason='The browser could not reach the Admin API. Check the deployed Worker/API and network connection.';else if(/duplicate|unique/i.test(s))reason='A record with the same unique value already exists.';V.insertAdjacentHTML('beforeend',`<div class="error"><strong>⚠ Error</strong><div>${esc(s)}</div><div class="sub"><b>এর অর্থ:</b> ${esc(reason)}</div></div>`)}async function api(path,opt={}){try{const r=await fetch(path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok||d.ok===false)throw Error(d.error||d.message||`Request failed (${r.status})`);return d}catch(e){explain(e);throw e}}function shell(title,desc,html){document.getElementById('pageTitle').textContent=title;document.getElementById('pageDesc').textContent=desc;V.innerHTML=html}function overview(){shell('Dashboard','Your Supabase data, license system and Telegram health at a glance',`<div class="grid"><div class="card"><div class="label">Active licenses</div><div class="value" id="cLic">—</div><div class="sub">Current active licenses</div></div><div class="card"><div class="label">Pending requests</div><div class="value" id="cReq">—</div><div class="sub">Waiting for approval</div></div><div class="card"><div class="label">Registered devices</div><div class="value" id="cDev">—</div><div class="sub">Device bindings</div></div><div class="card"><div class="label">Candle records</div><div class="value" id="cCan">—</div><div class="sub">Historical data</div></div></div><div class="panel"><h2>System Health</h2><div id="health">Checking services…</div></div><div class="panel"><h2>Quick Controls</h2><button class="action" onclick="loadView('requests')">Review Requests</button> <button class="action" onclick="loadView('licenses')">Manage Licenses</button> <button class="action" onclick="loadView('data')">Inspect Supabase Data</button></div>`);loadStats()}async function loadStats(){try{const d=await api('/api/dashboard-stats');['cLic','cReq','cDev','cCan'].forEach((id,i)=>document.getElementById(id).textContent=d.stats?.[i]??'0');document.getElementById('health').innerHTML='<span style="color:#43e6a3">● Supabase API connected</span>'}catch(e){document.getElementById('health').textContent='Dashboard API is not configured yet.'}}function generic(view){const map={licenses:['Licenses','Control active, expired and revoked licenses'],requests:['Requests','Review and approve incoming registrations'],devices:['Devices','Monitor license-to-device bindings'],telegram:['Telegram','Monitor Telegram connections and delivery'],data:['Supabase Data','Safe visibility into your existing database tables'],settings:['Settings','System configuration and diagnostics']};const [t,d]=map[view];shell(t,d,`<div class="panel"><h2>${t}</h2><div class="empty">This section is ready for live Supabase controls without changing existing data.</div></div>`)}async function loadView(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='overview')overview();else generic(v)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>loadView(b.dataset.view));loadView('overview');</script></body></html>
