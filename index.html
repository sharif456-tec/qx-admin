<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONEY IS EVERYTHING — Cloud Admin v3</title></head><body><div id="app"></div><script>
/* Admin UI keeps the existing dashboard; protected actions use fresh Supabase sessions. */
const SUPABASE_URL="https://timxqulcmqnynhqniwhr.supabase.co";const SUPABASE_KEY="sb_publishable_-5KdCFbWDJQQUxetnRYBIg_sHXh0Z20";let session=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,opt={}){const headers={apikey:SUPABASE_KEY,Authorization:"Bearer "+(session?.access_token||SUPABASE_KEY),...opt.headers};if(opt.body)headers["Content-Type"]="application/json";const r=await fetch(SUPABASE_URL+path,{...opt,headers});const t=await r.text();let d={};try{d=t.trim()?JSON.parse(t):{}}catch{d={message:t||`HTTP ${r.status}`}}if(!r.ok)throw Error(d?.message||d?.error_description||d?.error||`HTTP ${r.status}`);return d}
async function refreshSession(){if(!session?.refresh_token)throw Error("Supabase session expired. Please login again.");const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:session.refresh_token})});const t=await r.text();let d={};try{d=t.trim()?JSON.parse(t):{}}catch{}if(!r.ok||!d.access_token){session=null;throw Error(d.error_description||d.msg||"Supabase session refresh failed. Please login again.")}session=d;return session}
async function protectedFetch(path,opt={}){await refreshSession();return fetch(path,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+session.access_token}})}
async function rpc(name,body={}){await refreshSession();return api("/rest/v1/rpc/"+name,{method:"POST",body:JSON.stringify(body)})}
async function login(){const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;try{session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});const me=await api('/auth/v1/user');const admins=await api(`/rest/v1/admin_users?select=user_id&user_id=eq.${encodeURIComponent(me.id)}&limit=1`);if(!admins.length)throw Error('This account is not an Admin.');document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';await load()}catch(e){document.getElementById('err').textContent=e.message}}
async function load(){try{const rows=await rpc('admin_get_license_registrations');document.getElementById('rows').innerHTML=rows.filter(x=>x.status==='pending').map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.telegram_chat_id||x.telegram_chat||x.telegram)}</td><td>${esc(x.status)}</td><td><button onclick="approve(${Number(x.id)})">Approve</button><button onclick="rejectReq(${Number(x.id)})">Reject</button></td></tr>`).join('')||'<tr><td colspan=6>No pending requests</td></tr>'}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan=6>${esc(e.message)}</td></tr>`}}
async function approve(id){try{const r=await protectedFetch('/api/approve-license',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({request_id:Number(id)})});const t=await r.text();let out={};try{out=t.trim()?JSON.parse(t):{}}catch{}if(!r.ok||!out.ok)throw Error(out.error||out.message||`Approval failed (HTTP ${r.status})`);alert('Approved ✓ '+(out.telegram?.ok?'Telegram sent ✓':'Telegram not sent'));await load()}catch(e){alert(e.message)}}
async function rejectReq(id){try{const r=await protectedFetch('/api/reject-license',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({request_id:Number(id)})});const t=await r.text();let out={};try{out=t.trim()?JSON.parse(t):{}}catch{}if(!r.ok||!out.ok)throw Error(out.error||out.message||`Reject failed (HTTP ${r.status})`);alert('Rejected ✓');await load()}catch(e){alert(e.message)}}
document.getElementById('app').innerHTML=`<div id=login><h2>MONEY IS EVERYTHING — Cloud Admin</h2><input id=email type=email placeholder="Admin email"><input id=password type=password placeholder="Password"><button onclick=login()>Login</button><div id=err></div></div><div id=panel style="display:none"><h2>Pending Requests</h2><table border=1 cellpadding=8><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Telegram</th><th>Status</th><th>Action</th></tr></thead><tbody id=rows></tbody></table></div>`;
</script></body></html>
