<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QX Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827}
.card{width:min(92vw,410px);padding:28px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 15px 45px #00000012}
h1{margin:0 0 6px;font-size:28px}.sub{margin:0 0 22px;color:#6b7280}
label{display:block;margin:14px 0 7px;font-size:14px;font-weight:650}
input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:16px;font-weight:700}
button:disabled{opacity:.6}.links{display:flex;justify-content:space-between;margin-top:14px;font-size:14px}a{color:#2563eb;cursor:pointer}
#msg{min-height:22px;margin-top:14px;font-size:14px}.err{color:#b91c1c}.ok{color:#15803d}
</style>
</head>
<body>
<div class="card">
<h1>QX Admin</h1>
<p class="sub">Sign in to continue</p>
<form id="login">
<label>Email</label><input id="email" type="email" autocomplete="email" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="btn">Login</button>
</form>
<div class="links"><a id="signup">Create account</a><a id="reset">Forgot password?</a></div>
<div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
const client=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);
const msg=document.getElementById('msg'),btn=document.getElementById('btn');
const show=(t,c='')=>{msg.textContent=t;msg.className=c};

client.auth.getSession().then(({data})=>{
 if(data.session && location.pathname.endsWith('index.html')) location.href='./dashboard.html';
});

document.getElementById('login').addEventListener('submit',async e=>{
 e.preventDefault(); btn.disabled=true; show('Signing in…');
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const {error}=await client.auth.signInWithPassword({email,password});
 if(error){show(error.message,'err');btn.disabled=false;return;}
 show('Login successful.','ok');
 location.href='./dashboard.html';
});

document.getElementById('signup').onclick=async()=>{
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||!password)return show('Enter email and password first.','err');
 const {error}=await client.auth.signUp({email,password});
 show(error?error.message:'Account created. Check your email if confirmation is enabled.',error?'err':'ok');
};

document.getElementById('reset').onclick=async()=>{
 const email=document.getElementById('email').value.trim();
 if(!email)return show('Enter your email first.','err');
 const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
 show(error?error.message:'Password reset email sent.',error?'err':'ok');
};
</script>
</body>
</html>
