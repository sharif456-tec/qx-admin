<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QX Admin Control Center</title><style>:root{--bg:#06101d;--p:#0c1b2c;--line:#1d3b56;--text:#eff8ff;--muted:#91abc3;--a:#4ddcff;--g:#45e6a6;--r:#ff7184}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#123a5b,transparent 34%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:16px}.loginbox,.panel,.card{background:linear-gradient(145deg,#10253a,#0a1828);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px #0005}.loginbox{width:min(430px,100%)}.app{min-height:100vh}.side{padding:12px;border-bottom:1px solid var(--line);background:#071321e8;position:sticky;top:0;z-index:20}.side h2{margin:3px 8px 10px}.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.nav button,.action,.primary{border:1px solid #2b7593;background:#123e59;color:#fff;padding:10px 12px;border-radius:10px;font-weight:800;white-space:nowrap}.nav button{flex:0 0 auto}.action{display:inline-block;margin:3px}.primary{width:100%;padding:13px}.main{width:min(1500px,100%);margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.title h1{margin:0;font-size:25px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:15px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.value{font-size:27px;font-weight:900;margin-top:4px}.success{padding:12px;border:1px solid #28785e;background:#10382d;border-radius:13px}.error{margin-top:12px;border:1px solid #8c3b4b;background:#351923;border-radius:13px;padding:13px}.panel{margin-top:14px}.panel h2{margin:0 0 12px;font-size:17px}.pair-grid{display:grid;grid-template-columns:1fr;gap:10px}.pair-card{padding:15px;border:1px solid #1d3b56;border-radius:15px;background:#0b1c2d}.pair-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.pair-name{font-weight:900;font-size:16px}.badge{padding:4px 8px;border-radius:999px;background:#17324a;color:#dff7ff;font-size:11px}.pair-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.meta-box{background:#071625;border-radius:10px;padding:9px}.meta-box small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.meta-box b{display:block;margin-top:2px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px;border-bottom:1px solid #18324a;white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase}input{width:100%;padding:12px;margin:7px 0 13px;background:#071625;color:#fff;border:1px solid #27445d;border-radius:10px}#pairCards{display:block}.desktop-table{display:none}@media(min-width:700px){.app{display:grid;grid-template-columns:240px 1fr}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);border-bottom:0;padding:18px}.nav{display:block;overflow:visible}.nav button{display:block;width:100%;text-align:left;margin:4px 0}.main{padding:25px}.grid{grid-template-columns:repeat(4,1fr)}.pair-grid{display:none}.desktop-table{display:block}.top{align-items:center}}@media(max-width:699px){.top{flex-direction:column}.status{font-size:12px}.panel{padding:14px}}</style></head><body><div id="loginScreen" class="login"><div class="loginbox"><h2>QX ADMIN</h2><div class="muted">Secure Control Center</div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="primary" onclick="login()">🔐 Sign in</button><div id="loginErr"></div></div></div><div id="appScreen" class="app hidden"><aside class="side"><h2>QX ADMIN</h2><div class="nav"><button onclick="load('overview')">◈ Overview</button><button onclick="load('requests')">📥 Pending Requests</button><button onclick="load('licenses')">🔑 Licenses</button><button onclick="load('devices')">📱 Devices</button><button onclick="load('telegram')">✈ Telegram</button><button onclick="load('candles')">🕯 Candles</button><button onclick="load('market')">📊 Market Data</button></div><button class="action" onclick="logout()">↪ Logout</button></aside><main class="main"><div class="top"><div><div class="title"><h1 id="title">Dashboard</h1></div><div class="muted" id="desc">Live Supabase control center</div></div><div class="badge">● Supabase connected</div></div><section id="view"></section></main></div><script>const URL="https://timxqulcmqnynhqniwhr.supabase.co",KEY="sb_publishable_-5KdCFbWDJQQUxetnRYBIg_sHXh0Z20";let session=null;const V=document.getElementById('view'),loginScreen=document.getElementById('loginScreen'),appScreen=document.getElementById('appScreen'),loginErr=document.getElementById('loginErr');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function explain(e){return `<div class="error"><b>⚠ ${esc(e?.message||e)}</b><br><span class="muted">Supabase connection is preserved.</span></div>`}async function sb(path,opt={}){const h={apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),...(opt.headers||{})};if(opt.body)h['Content-Type']='application/json';const r=await fetch(URL+path,{...opt,headers:h});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw Error(d.message||d.hint||`HTTP ${r.status}`);return d}async function login(){loginErr.innerHTML='';try{session=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const me=await sb('/auth/v1/user');const a=await sb(`/rest/v1/admin_users?select=user_id,email&user_id=eq.${encodeURIComponent(me.id)}&limit=1`);if(!a.length)throw Error('This account is not an Admin.');localStorage.setItem('qx_admin_session',JSON.stringify(session));showApp();load('overview')}catch(e){loginErr.innerHTML=explain(e)}}function restore(){try{const x=JSON.parse(localStorage.getItem('qx_admin_session')||'null');if(x?.access_token){session=x;showApp();load('overview')}}catch{}}function logout(){localStorage.removeItem('qx_admin_session');location.reload()}function showApp(){loginScreen.classList.add('hidden');appScreen.classList.remove('hidden')}function shell(t,d,h){document.getElementById('title').textContent=t;document.getElementById('desc').textContent=d;V.innerHTML=h}async function load(v){try{if(v==='overview')return overview();if(v==='requests')return requests();if(v==='licenses')return tableView('Licenses','Live licenses','licenses',['id','license_key','customer_name','customer_email','status','starts_at','expires_at','max_devices']);if(v==='devices')return tableView('Devices','Live device bindings','devices',['id','license_id','device_id','device_name','status','activated_at','last_seen']);if(v==='telegram')return tableView('Telegram','Live Telegram connections','telegram_chats',['id','chat_id','username','first_name','last_name','last_seen_at']);if(v==='candles')return tableView('Candles','Existing candle dataset','candles',['id','pair','timeframe','candle_time','open','high','low','close','ticks']);if(v==='market')return market()}catch(e){V.innerHTML=explain(e)}}async function overview(){shell('Dashboard','Mobile-first live Supabase overview','<div class="grid"><div class="card"><div class="label">Active Licenses</div><div class="value" id="a">…</div></div><div class="card"><div class="label">Pending Requests</div><div class="value" id="b">…</div></div><div class="card"><div class="label">Devices</div><div class="value" id="c">…</div></div><div class="card"><div class="label">Total Candles</div><div class="value" id="d">…</div></div></div><div class="panel"><h2>Pair Data</h2><div class="success">18 pairs • 177,329 candles available. Mobile uses cards; desktop uses a table.</div><div id="pairCards" class="pair-grid" style="margin-top:12px">Loading…</div><div class="desktop-table tablewrap" style="margin-top:12px"><table><thead><tr><th>Pair</th><th>Timeframe</th><th>Candle Count</th><th>First Candle</th><th>Latest Candle</th></tr></thead><tbody id="pairTable"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div>');const [al,p,dev,can,pairs]=await Promise.all([count('licenses','&status=eq.active'),count('license_requests','&status=eq.pending'),count('devices'),count('candles'),pairSummary()]);a.textContent=al;b.textContent=p;c.textContent=dev;d.textContent=can;renderPairs(pairs)}async function pairSummary(){const rows=await sb('/rest/v1/candles?select=pair,timeframe,candle_time&order=pair.asc,candle_time.desc&limit=1000');const m=new Map();for(const r of rows){const k=r.pair+'|'+r.timeframe;if(!m.has(k))m.set(k,{pair:r.pair,timeframe:r.timeframe,count:0,latest:r.candle_time,first:r.candle_time});const x=m.get(k);x.count++;if(r.candle_time>x.latest)x.latest=r.candle_time;if(r.candle_time<x.first)x.first=r.candle_time}return [...m.values()]}function renderPairs(rows){document.getElementById('pairCards').innerHTML=rows.map(r=>`<div class="pair-card"><div class="pair-head"><div class="pair-name">${esc(r.pair)}</div><span class="badge">${esc(r.timeframe)} sec</span></div><div class="pair-meta"><div class="meta-box"><small>Candles</small><b>${r.count.toLocaleString()}</b></div><div class="meta-box"><small>Latest</small><b>${esc(r.latest)}</b></div></div></div>`).join('');document.getElementById('pairTable').innerHTML=rows.map(r=>`<tr><td>${esc(r.pair)}</td><td>${esc(r.timeframe)} sec</td><td>${r.count.toLocaleString()}</td><td>${esc(r.first)}</td><td>${esc(r.latest)}</td></tr>`).join('')}async function count(table,filter=''){const r=await fetch(`${URL}/rest/v1/${table}?select=*${filter}`,{headers:{apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),Prefer:'count=exact',Range:'0-0'}});if(!r.ok)throw Error(await r.text());const cr=r.headers.get('content-range');return cr?Number(cr.split('/')[1]):0}async function requests(){shell('Pending Requests','Requests from public.license_requests','<div class="panel"><h2>Pending License Requests</h2><div id="req">Loading…</div></div>');try{const rows=await sb('/rest/v1/license_requests?select=*&status=eq.pending&order=created_at.desc&limit=100');document.getElementById('req').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Telegram</th><th>Device</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.telegram||r.telegram_chat_id)}</td><td>${esc(r.device_name||r.device_id)}</td><td>${esc(r.status)}</td><td>${esc(r.created_at)}</td><td><button class="action" onclick="approve('${esc(r.id)}')">Approve</button><button class="action" onclick="rejectReq('${esc(r.id)}')">Reject</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No pending requests.</div>'}catch(e){document.getElementById('req').innerHTML=explain(e)}}async function protectedAction(path,id){try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({request_id:id})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||d.message||`HTTP ${r.status}`);requests()}catch(e){V.insertAdjacentHTML('beforeend',explain(e))}}function approve(id){protectedAction('/api/approve-license',id)}function rejectReq(id){protectedAction('/api/reject-license',id)}async function tableView(t,d,table,cols){shell(t,d,'<div class="panel"><div class="tablewrap" id="tb">Loading…</div></div>');const rows=await sb(`/rest/v1/${table}?select=*&order=id.desc&limit=100`);document.getElementById('tb').innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}async function market(){await tableView('Market Data','Original market_data schema','market_data',['id','paird','timeframe','candel_time','open','high','low','Close','ticks','created_at'])}restore();</script></body></html>
