<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>QX Admin • Control Center</title>
<style>
:root{--bg:#06101d;--panel:#0d2137;--panel2:#102d49;--line:#245a7b;--blue:#4ddcff;--green:#45e6a6;--red:#ff7184;--yellow:#ffd166;--text:#eff8ff;--muted:#91abc3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#123b62,transparent 34%),var(--bg);color:var(--text);font:14px/1.5 system-ui,Arial}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.box,.panel,.card{background:linear-gradient(145deg,#102d49ee,#071727ee);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px #0007}.box{width:min(430px,100%);padding:25px}h1,h2,h3{margin-top:0}.app{min-height:100vh}.side{background:#04111fef;border-bottom:1px solid var(--line);padding:12px;position:sticky;top:0;z-index:20}.side h2{color:var(--blue);margin:3px 8px 12px}.nav{display:flex;gap:6px;overflow:auto}.btn,.primary{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#123b60;color:#fff;font-weight:800;cursor:pointer}.btn:hover{border-color:var(--blue)}.danger{background:#5a1e2c;border-color:#8c3348}.good{background:#114a3c;border-color:#23785e}.primary{width:100%;background:#176dcc;padding:12px}.main{max-width:1600px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:#dff7ff;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:15px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.value{font-size:27px;font-weight:900}.panel{padding:16px;margin-top:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #245a7b55;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:10px;text-transform:uppercase}input,select{width:100%;padding:11px;margin:6px 0 12px;background:#04111f;color:#fff;border:1px solid var(--line);border-radius:10px}.actions{display:flex;gap:5px;flex-wrap:wrap}.error{padding:12px;border:1px solid #8c3348;background:#351923;border-radius:12px;margin-top:10px}.meaning{color:#ffd8de;margin-top:5px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:15px;z-index:100}.modal>div{width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px;background:#0b2034;border:1px solid var(--line);border-radius:18px}.small{font-size:12px;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:800px){.app{display:grid;grid-template-columns:245px 1fr}.side{height:100vh;border-right:1px solid var(--line);border-bottom:0}.nav{display:block}.nav .btn{display:block;width:100%;margin:5px 0;text-align:left}.main{padding:25px}}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.main{padding:12px}}
</style></head><body>
<div id="loginScreen" class="login"><div class="box"><h2>QX ADMIN</h2><div class="small">Secure Blue Glass Control Center</div><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary" onclick="login()">🔐 Sign in</button><div id="loginErr"></div></div></div>
<div id="appScreen" class="app hidden"><aside class="side"><h2>QX ADMIN</h2><div class="nav"><button class="btn" onclick="load('overview')">◈ Overview</button><button class="btn" onclick="load('requests')">📥 Requests</button><button class="btn" onclick="load('licenses')">🔑 Licenses</button><button class="btn" onclick="load('devices')">📱 Devices</button><button class="btn" onclick="load('telegram')">✈ Telegram</button><button class="btn" onclick="load('candles')">🕯 Candles</button><button class="btn" onclick="load('market')">📊 Market</button></div><button class="btn" onclick="manualLicense()">➕ Create License</button><button class="btn" onclick="logout()">↪ Logout</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div id="desc" class="small">Live Supabase control center</div></div><span class="badge">● Live Supabase</span></div><section id="view"></section></main></div><div id="modal"></div>
<script>
const URL='https://timxqulcmqnynhqniwhr.supabase.co',KEY='sb_publishable_-5KdCFbWDJQQUxetnRYBIg_sHXh0Z20';let session=null;const V=()=>document.getElementById('view');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function explain(e){let m=String(e?.message||e);let meaning='এই error-এর অর্থ: Supabase/API আপনার অনুরোধটি গ্রহণ করতে পারেনি।';if(/permission|denied|403|row level/i.test(m))meaning='এই error-এর অর্থ: আপনার Admin account-এর permission/RLS policy এই কাজটি অনুমতি দিচ্ছে না।';if(/column|schema/i.test(m))meaning='এই error-এর অর্থ: Dashboard যে field ব্যবহার করছে সেটি database schema-তে নেই বা নাম আলাদা।';if(/expired|jwt|session|401/i.test(m))meaning='এই error-এর অর্থ: Admin login session শেষ হয়েছে। আবার Login করুন।';if(/telegram/i.test(m))meaning='এই error-এর অর্থ: Telegram account-এর Chat ID/linking বা Bot delivery সমস্যা।';return `<div class="error"><b>⚠ ${esc(m)}</b><div class="meaning">${meaning}</div></div>`}
async function sb(path,opt={}){const h={apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),...(opt.headers||{})};if(opt.body)h['Content-Type']='application/json';const r=await fetch(URL+path,{...opt,headers:h});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw Error(d.message||d.hint||`HTTP ${r.status}`);return d}
async function rpc(name,args={}){return sb('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(args)})}
async function login(){document.getElementById('loginErr').innerHTML='';try{session=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});const me=await sb('/auth/v1/user');const a=await sb(`/rest/v1/admin_users?select=user_id&user_id=eq.${encodeURIComponent(me.id)}&limit=1`);if(!a.length)throw Error('This account is not an Admin.');localStorage.setItem('qx_admin_session',JSON.stringify(session));showApp();load('overview')}catch(e){document.getElementById('loginErr').innerHTML=explain(e)}}
function restore(){try{const x=JSON.parse(localStorage.getItem('qx_admin_session')||'null');if(x?.access_token){session=x;showApp();load('overview')}}catch{}}function logout(){localStorage.removeItem('qx_admin_session');location.reload()}function showApp(){loginScreen.classList.add('hidden');appScreen.classList.remove('hidden')}function shell(t,d,h){document.getElementById('title').textContent=t;document.getElementById('desc').textContent=d;V().innerHTML=h}
async function load(v){try{if(v==='overview')return overview();if(v==='requests')return requests();if(v==='licenses')return licenses();if(v==='devices')return devices();if(v==='telegram')return table('Telegram','telegram_chats',['id','chat_id','username','first_name','last_name','last_seen_at']);if(v==='candles')return table('Candles','candles',['id','pair','timeframe','candle_time','open','high','low','close','ticks']);if(v==='market')return table('Market Data','market_data',['id','paird','timeframe','candel_time','open','high','low','Close','ticks','created_at'])}catch(e){V().innerHTML=explain(e)}}
async function count(t,f=''){const r=await fetch(`${URL}/rest/v1/${t}?select=id${f}`,{headers:{apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),Prefer:'count=exact',Range:'0-0'}});if(!r.ok)throw Error(await r.text());const x=r.headers.get('content-range');return x?Number(x.split('/')[1]):0}
async function overview(){shell('Dashboard','Live database overview',`<div class="grid"><div class="card"><div class="label">Active Licenses</div><div id="a" class="value">…</div></div><div class="card"><div class="label">Pending Requests</div><div id="b" class="value">…</div></div><div class="card"><div class="label">Devices</div><div id="c" class="value">…</div></div><div class="card"><div class="label">Candles</div><div id="d" class="value">…</div></div></div><div class="panel"><h2>Quick Control</h2><button class="btn" onclick="manualLicense()">➕ Manual License</button><button class="btn" onclick="load('licenses')">🔑 Manage Licenses</button><button class="btn" onclick="load('devices')">📱 Manage Devices</button><button class="btn" onclick="load('requests')">📥 Requests</button></div>`);[a.textContent,b.textContent,c.textContent,d.textContent]=await Promise.all([count('licenses','&status=eq.active'),count('license_requests','&status=eq.pending'),count('devices'),count('candles')])}
async function requests(){shell('Requests','Approve or reject new registrations','<div class="panel"><div id="req">Loading…</div></div>');try{const rows=await sb('/rest/v1/license_requests?select=*&order=created_at.desc&limit=200');document.getElementById('req').innerHTML='<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Telegram</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.telegram||r.telegram_chat_id)}</td><td>${esc(r.status)}</td><td>${esc(r.created_at)}</td><td>${r.status==='pending'?`<button class="btn good" onclick="approve('${esc(r.id)}')">Approve</button><button class="btn danger" onclick="rejectReq('${esc(r.id)}')">Reject</button>`:'—'}</td></tr>`).join('')+'</tbody></table></div>'}catch(e){document.getElementById('req').innerHTML=explain(e)}}
async function approve(id){try{const r=await fetch('/api/approve-license',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({request_id:id})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||d.message);alert(d.telegram?.ok?'Approved + Telegram sent':'Approved. Telegram not sent: '+(d.telegram?.error||''));load('requests')}catch(e){V().insertAdjacentHTML('beforeend',explain(e))}}
async function rejectReq(id){try{const r=await fetch('/api/reject-license',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({request_id:id})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||d.message);load('requests')}catch(e){V().insertAdjacentHTML('beforeend',explain(e))}}
async function licenses(){shell('License Control','Block, revoke, edit, resend and create','<div class="panel"><div id="lic">Loading…</div></div>');try{const rows=await sb('/rest/v1/licenses?select=*&order=created_at.desc&limit=200');document.getElementById('lic').innerHTML='<div class="tablewrap"><table><thead><tr><th>License</th><th>Customer</th><th>Status</th><th>Expires</th><th>Devices</th><th>Action</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${esc(r.license_key)}</td><td>${esc(r.customer_name||'')}<br><span class="small">${esc(r.customer_email||'')}</span></td><td>${esc(r.status)}</td><td>${esc(r.expires_at)}</td><td>${esc(r.max_devices)}</td><td class="actions"><button class="btn" onclick="editLicense('${r.id}')">✏ Edit</button><button class="btn ${r.status==='active'?'danger':'good'}" onclick="setStatus('${r.id}','${r.status==='active'?'blocked':'active'}')">${r.status==='active'?'🔒 Block':'🟢 Activate'}</button><button class="btn danger" onclick="setStatus('${r.id}','revoked')">❌ Revoke</button><button class="btn" onclick="resend('${r.id}')">📤 Resend</button></td></tr>`).join('')+'</tbody></table></div>'}catch(e){document.getElementById('lic').innerHTML=explain(e)}}
async function setStatus(id,status){if(!confirm('এই license-এর status '+status+' করতে চান?'))return;try{await rpc('admin_set_license_status',{p_license_id:id,p_status:status});load('licenses')}catch(e){V().insertAdjacentHTML('beforeend',explain(e))}}
async function editLicense(id){try{const r=(await sb(`/rest/v1/licenses?select=*&id=eq.${id}&limit=1`))[0];modal(`<h2>✏ Edit License</h2><label>Expiry</label><input id="mexp" type="datetime-local" value="${new Date(r.expires_at).toISOString().slice(0,16)}"><label>Device Limit</label><input id="mdev" type="number" min="1" value="${r.max_devices}"><button class="btn good" onclick="saveEdit('${id}')">Save</button> <button class="btn" onclick="closeModal()">Cancel</button>`)}catch(e){V().insertAdjacentHTML('beforeend',explain(e))}}
async function saveEdit(id){try{await rpc('admin_update_license',{p_license_id:id,p_expires_at:new Date(document.getElementById('mexp').value).toISOString(),p_max_devices:Number(document.getElementById('mdev').value)});closeModal();load('licenses')}catch(e){document.getElementById('modal').insertAdjacentHTML('beforeend',explain(e))}}
async function resend(id){try{const r=await fetch('/api/resend-license',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({license_id:id})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||d.message);alert('Telegram delivery successful');}catch(e){V().insertAdjacentHTML('beforeend',explain(e))}}
async function manualLicense(){modal(`<h2>➕ Create License</h2><label>Name</label><input id="mn"><label>Email</label><input id="me" type="email"><label>Telegram Chat ID (optional)</label><input id="mt"><label>Expiry</label><input id="mx" type="datetime-local" value="${new Date(Date.now()+365*86400000).toISOString().slice(0,16)}"><label>Device Limit</label><input id="md" type="number" min="1" value="1"><button class="btn good" onclick="createManual()">Create</button> <button class="btn" onclick="closeModal()">Cancel</button>`)}
async function createManual(){try{const d=await rpc('admin_create_license',{p_customer_name:mn.value.trim()||null,p_customer_email:me.value.trim()||null,p_expires_at:new Date(mx.value).toISOString(),p_max_devices:Number(md.value),p_telegram_chat_id:mt.value.trim()||null});closeModal();alert('License created: '+d.license_key);load('licenses')}catch(e){document.getElementById('modal').insertAdjacentHTML('beforeend',explain(e))}}
async function devices(){shell('Device Control','Block/unblock or remove device binding','<div class="panel"><div id="dev">Loading…</div></div>');try{const rows=await sb('/rest/v1/devices?select=*&order=last_seen.desc&limit=200');document.getElementById('dev').innerHTML='<div class="tablewrap"><table><thead><tr><th>Device</th><th>License</th><th>Status</th><th>Last Seen</th><th>Action</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${esc(r.device_name||'')}<br><span class="small">${esc(r.device_id)}</span></td><td>${esc(r.license_id)}</td><td>${esc(r.status)}</td><td>${esc(r.last_seen)}</td><td><button class="btn ${r.status==='active'?'danger':'good'}" onclick="deviceStatus('${r.id}','${r.status==='active'?'blocked':'active'}')">${r.status==='active'?'🔒 Block':'🟢 Activate'}</button><button class="btn danger" onclick="removeDevice('${r.id}')">Remove</button></td></tr>`).join('')+'</tbody></table></div>'}catch(e){document.getElementById('dev').innerHTML=explain(e)}}
async function deviceStatus(id,status){try{await rpc('admin_set_device_status',{p_device_id:id,p_status:status});load('devices')}catch(e){V().insertAdjacentHTML('beforeend',explain(e))}}async function removeDevice(id){if(!confirm('Device binding remove করবেন?'))return;try{await rpc('admin_remove_device',{p_device_id:id});load('devices')}catch(e){V().insertAdjacentHTML('beforeend',explain(e))}}
async function table(title,t,cols){shell(title,'Read-only live data','<div class="panel"><div id="tb">Loading…</div></div>');try{const rows=await sb(`/rest/v1/${t}?select=*&order=id.desc&limit=200`);document.getElementById('tb').innerHTML='<div class="tablewrap"><table><thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>`<td>${esc(r[c]??'—')}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}catch(e){document.getElementById('tb').innerHTML=explain(e)}}
function modal(h){document.getElementById('modal').innerHTML='<div class="modal"><div>'+h+'</div></div>'}function closeModal(){document.getElementById('modal').innerHTML=''}restore();
</script></body></html>
