<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>QX Admin • Blue Glass Control Center</title><style>:root{--bg:#06101d;--glass:rgba(11,31,53,.78);--glass2:rgba(18,50,80,.62);--line:rgba(77,220,255,.2);--blue:#4ddcff;--blue2:#258bff;--green:#45e6a6;--red:#ff7184;--text:#eff8ff;--muted:#91abc3;--shadow:0 18px 50px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,rgba(37,139,255,.24),transparent 32%),radial-gradient(circle at 90% 10%,rgba(77,220,255,.12),transparent 28%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:16px}.loginbox,.panel,.card{background:linear-gradient(145deg,rgba(16,42,70,.86),rgba(7,22,39,.86));border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.loginbox{width:min(430px,100%);padding:24px}.loginbox h2{margin:0 0 4px;letter-spacing:1px}.app{min-height:100vh}.side{padding:12px;background:rgba(4,17,31,.88);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(18px)}.side h2{margin:3px 8px 10px;color:var(--blue)}.nav{display:flex;gap:7px;overflow-x:auto}.nav button,.action,.primary{border:1px solid var(--line);background:linear-gradient(135deg,rgba(37,139,255,.25),rgba(18,62,89,.75));color:#fff;padding:10px 13px;border-radius:11px;font-weight:800;white-space:nowrap;cursor:pointer}.nav button:active,.action:active,.primary:active{transform:scale(.98)}.primary{width:100%;padding:13px;background:linear-gradient(135deg,var(--blue2),#1764c4)}.action{display:inline-block;margin:3px}.main{width:min(1500px,100%);margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.title h1{margin:0;font-size:26px}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:rgba(37,139,255,.14);border:1px solid var(--line);color:#dff7ff;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:16px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}.value{font-size:28px;font-weight:900;margin-top:4px}.panel{margin-top:14px;padding:16px}.panel h2{margin:0 0 12px;font-size:17px}.success{padding:12px;border:1px solid rgba(69,230,166,.3);background:rgba(16,56,45,.65);border-radius:13px;color:#caffed}.error{margin-top:12px;border:1px solid rgba(255,113,132,.4);background:rgba(53,25,35,.7);border-radius:13px;padding:13px}.pair-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}.pair-card{padding:15px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(18,50,80,.65),rgba(7,22,39,.7));box-shadow:0 8px 25px rgba(0,0,0,.18)}.pair-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.pair-name{font-weight:900;font-size:16px}.pair-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.meta-box{background:rgba(4,17,31,.65);border:1px solid rgba(255,255,255,.05);border-radius:11px;padding:9px}.meta-box small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.meta-box b{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px;border-bottom:1px solid rgba(77,220,255,.12);white-space:nowrap}th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}input{width:100%;padding:12px;margin:7px 0 13px;background:rgba(4,17,31,.8);color:#fff;border:1px solid var(--line);border-radius:11px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,220,255,.08)}.desktop-table{display:none}@media(min-width:700px){.app{display:grid;grid-template-columns:245px 1fr}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);border-bottom:0;padding:18px}.nav{display:block;overflow:visible}.nav button{display:block;width:100%;text-align:left;margin:5px 0}.main{padding:26px}.grid{grid-template-columns:repeat(4,1fr)}.pair-grid{display:none}.desktop-table{display:block}.top{align-items:center}}@media(max-width:699px){.top{flex-direction:column}.main{padding:13px}.panel{padding:14px}.title h1{font-size:23px}.card{padding:14px}}@media(max-width:380px){.grid{grid-template-columns:1fr}.pair-meta{grid-template-columns:1fr}.nav button{padding:9px 11px}}</style></head><body><div id="loginScreen" class="login"><div class="loginbox"><h2>QX ADMIN</h2><div class="muted">Blue Glass • Secure Control Center</div><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary" onclick="login()">🔐 Sign in</button><div id="loginErr"></div></div></div><div id="appScreen" class="app hidden"><aside class="side"><h2>QX ADMIN</h2><div class="nav"><button onclick="load('overview')">◈ Overview</button><button onclick="load('requests')">📥 Pending</button><button onclick="load('licenses')">🔑 Licenses</button><button onclick="load('devices')">📱 Devices</button><button onclick="load('telegram')">✈ Telegram</button><button onclick="load('candles')">🕯 Candles</button><button onclick="load('market')">📊 Market</button></div><button class="action" onclick="logout()">↪ Logout</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted" id="desc">Live Supabase control center</div></div><div class="badge">● Supabase connected</div></div><section id="view"></section></main></div><script>const URL="https://timxqulcmqnynhqniwhr.supabase.co",KEY="sb_publishable_-5KdCFbWDJQQUxetnRYBIg_sHXh0Z20";let session=null;const V=document.getElementById('view'),loginScreen=document.getElementById('loginScreen'),appScreen=document.getElementById('appScreen'),loginErr=document.getElementById('loginErr');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function explain(e){return `<div class="error"><b>⚠ ${esc(e?.message||e)}</b><br><span class="muted">Data connection is preserved.</span></div>`}async function sb(path,opt={}){const h={apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),...(opt.headers||{})};if(opt.body)h['Content-Type']='application/json';const r=await fetch(URL+path,{...opt,headers:h});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw Error(d.message||d.hint||`HTTP ${r.status}`);return d}async function login(){loginErr.innerHTML='';try{session=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const me=await sb('/auth/v1/user');const a=await sb(`/rest/v1/admin_users?select=user_id,email&user_id=eq.${encodeURIComponent(me.id)}&limit=1`);if(!a.length)throw Error('This account is not an Admin.');localStorage.setItem('qx_admin_session',JSON.stringify(session));showApp();load('overview')}catch(e){loginErr.innerHTML=explain(e)}}function restore(){try{const x=JSON.parse(localStorage.getItem('qx_admin_session')||'null');if(x?.access_token){session=x;showApp();load('overview')}}catch{}}function logout(){localStorage.removeItem('qx_admin_session');location.reload()}function showApp(){loginScreen.classList.add('hidden');appScreen.classList.remove('hidden')}function shell(t,d,h){document.getElementById('title').textContent=t;document.getElementById('desc').textContent=d;V.innerHTML=h}async function load(v){try{if(v==='overview')return overview();if(v==='requests')return requests();if(v==='licenses')return tableView('Licenses','Live licenses','licenses',['id','license_key','customer_name','customer_email','status','starts_at','expires_at','max_devices']);if(v==='devices')return tableView('Devices','Live device bindings','devices',['id','license_id','device_id','device_name','status','activated_at','last_seen']);if(v==='telegram')return tableView('Telegram','Live Telegram connections','telegram_chats',['id','chat_id','username','first_name','last_name','last_seen_at']);if(v==='candles')return tableView('Candles','Existing candle dataset','candles',['id','pair','timeframe','candle_time','open','high','low','close','ticks']);if(v==='market')return market()}catch(e){V.innerHTML=explain(e)}}async function overview(){shell('Dashboard','Blue Glass • Mobile-first live Supabase overview','<div class="grid"><div class="card"><div class="label">Active Licenses</div><div class="value" id="a">…</div></div><div class="card"><div class="label">Pending Requests</div><div class="value" id="b">…</div></div><div class="card"><div class="label">Devices</div><div class="value" id="c">…</div></div><div class="card"><div class="label">Total Candles</div><div class="value" id="d">…</div></div></div><div class="panel"><h2>Pair Data</h2><div class="success">Live candle dataset • Mobile cards • Desktop table</div><div id="pairCards" class="pair-grid">Loading…</div><div class="desktop-table tablewrap"><table><thead><tr><th>Pair</th><th>Timeframe</th><th>Candle Count</th><th>First Candle</th><th>Latest Candle</th></tr></thead><tbody id="pairTable"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div>');const [al,p,dev,can,pairs]=await Promise.all([count('licenses','&status=eq.active'),count('license_requests','&status=eq.pending'),count('devices'),count('candles'),pairSummary()]);a.textContent=al;b.textContent=p;c.textContent=dev;d.textContent=can;renderPairs(pairs)}async function pairSummary(){const rows=await sb('/rest/v1/candles?select=pair,timeframe,candle_time&order=pair.asc,candle_time.desc&limit=1000');const m=new Map();for(const r of rows){const k=r.pair+'|'+r.timeframe;if(!m.has(k))m.set(k,{pair:r.pair,timeframe:r.timeframe,count:0,latest:r.candle_time,first:r.candle_time});const x=m.get(k);x.count++;if(r.candle_time>x.latest)x.latest=r.candle_time;if(r.candle_time<x.first)x.first=r.candle_time}return [...m.values()]}function renderPairs(rows){document.getElementById('pairCards').innerHTML=rows.map(r=>`<div class="pair-card"><div class="pair-head"><div class="pair-name">${esc(r.pair)}</div><span class="badge">${esc(r.timeframe)} sec</span></div><div class="pair-meta"><div class="meta-box"><small>Candles</small><b>${r.count.toLocaleString()}</b></div><div class="meta-box"><small>Latest</small><b>${esc(r.latest)}</b></div></div></div>`).join('');document.getElementById('pairTable').innerHTML=rows.map(r=>`<tr><td>${esc(r.pair)}</td><td>${esc(r.timeframe)} sec</td><td>${r.count.toLocaleString()}</td><td>${esc(r.first)}</td><td>${esc(r.latest)}</td></tr>`).join('')}async function count(table,filter=''){const r=await fetch(`${URL}/rest/v1/${table}?select=*${filter}`,{headers:{apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),Prefer:'count=exact',Range:'0-0'}});if(!r.ok)throw Error(await r.text());const cr=r.headers.get('content-range');return cr?Number(cr.split('/')[1]):0}async function requests(){shell('Pending Requests','Requests from public.license_requests','<div class="panel"><h2>Pending License Requests</h2><div id="req">Loading…</div></div>');try{const rows=await sb('/rest/v1/license_requests?select=*&status=eq.pending&order=created_at.desc&limit=100');document.getElementById('req').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Telegram</th><th>Device</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.telegram||r.telegram_chat_id)}</td><td>${esc(r.device_name||r.device_id)}</td><td>${esc(r.status)}</td><td>${esc(r.created_at)}</td><td><button class="action" onclick="approve('${esc(r.id)}')">Approve</button><button class="action" onclick="rejectReq('${esc(r.id)}')">Reject</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No pending requests.</div>'}catch(e){document.getElementById('req').innerHTML=explain(e)}}async function protectedAction(path,id){try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({request_id:id})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||d.message||`HTTP ${r.status}`);requests()}catch(e){V.insertAdjacentHTML('beforeend',explain(e))}}function approve(id){protectedAction('/api/approve-license',id)}function rejectReq(id){protectedAction('/api/reject-license',id)}async function tableView(t,d,table,cols){shell(t,d,'<div class="panel"><div class="tablewrap" id="tb">Loading…</div></div>');const rows=await sb(`/rest/v1/${table}?select=*&order=id.desc&limit=100`);document.getElementById('tb').innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}async function market(){await tableView('Market Data','Original market_data schema','market_data',['id','paird','timeframe','candel_time','open','high','low','Close','ticks','created_at'])}restore();</script></body></html>
