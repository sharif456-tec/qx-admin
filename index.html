<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QX Admin Control Center</title><style>:root{--bg:#06101d;--p:#0c1b2c;--p2:#10263b;--line:#1d3b56;--text:#eff8ff;--muted:#91abc3;--a:#4ddcff;--g:#45e6a6;--r:#ff7184;--y:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#123a5b,transparent 34%),radial-gradient(circle at 100% 10%,#1c3150,transparent 30%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:linear-gradient(145deg,#102941,#091727);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 25px 80px #0009}.logo{font-size:27px;font-weight:900;margin-bottom:5px}.logo span{color:var(--a)}.muted{color:var(--muted)}input,select{width:100%;padding:12px;background:#071625;border:1px solid #27445d;color:#fff;border-radius:11px;margin:7px 0 13px}button{cursor:pointer}button.primary,.action{border:1px solid #2b7593;background:#123e59;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800}.primary{width:100%;padding:13px!important}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:22px 15px;border-right:1px solid var(--line);background:#071321e8;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;margin-bottom:25px}.brand span{color:var(--a)}.nav button{width:100%;background:transparent;border:0;color:var(--muted);padding:12px;border-radius:11px;text-align:left;font-weight:800;margin:2px 0}.nav button.active,.nav button:hover{background:#15334d;color:#fff}.logout{margin-top:25px;width:100%;background:#321925;border:1px solid #733445;color:#ffb9c3;padding:10px;border-radius:10px}.main{width:min(1500px,100%);margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.title h1{margin:0;font-size:28px}.status{border:1px solid var(--line);border-radius:999px;padding:8px 13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 13px var(--g);margin-right:7px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:linear-gradient(145deg,#10253a,#0a1828);border:1px solid var(--line);border-radius:18px;box-shadow:0 15px 45px #0005}.card{padding:18px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.value{font-size:28px;font-weight:900;margin-top:6px}.panel{padding:18px;margin-top:15px}.panel h2{margin:0 0 14px;font-size:17px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #18324a;white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase}.ok{background:#10382d!important;border-color:#28785e!important}.danger{background:#421b26!important;border-color:#803848!important}.badge{padding:4px 8px;border-radius:999px;font-size:11px;background:#17324a}.error{margin-top:12px;border:1px solid #8c3b4b;background:#351923;border-radius:13px;padding:13px;color:#ffe0e5}.error strong{color:#ff93a2}.success{margin-top:12px;border:1px solid #28785e;background:#10382d;border-radius:13px;padding:13px}.empty{text-align:center;padding:30px;color:var(--muted)}#toast{position:fixed;right:18px;bottom:18px;max-width:430px;display:none;background:#102a3e;border:1px solid var(--line);padding:13px 16px;border-radius:12px;z-index:50}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.main{padding:14px}.top{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><div id="login" class="login"><div class="loginbox"><div class="logo">QX <span>ADMIN</span></div><div class="muted">Secure Control Center</div><br><label>Admin Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@email.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"><button class="primary" onclick="login()">🔐 Sign in to Admin</button><div id="loginErr"></div></div></div><div id="app" class="app hidden"><aside class="side"><div class="brand">QX <span>ADMIN</span><br><small>CONTROL CENTER</small></div><div class="nav"><button data-v="overview">◈ Overview</button><button data-v="requests">📥 Requests</button><button data-v="licenses">🔑 Licenses</button><button data-v="devices">📱 Devices</button><button data-v="telegram">✈ Telegram</button><button data-v="candles">🕯 Candles</button><button data-v="market">📊 Market Data</button><button data-v="settings">⚙ Diagnostics</button></div><button class="logout" onclick="logout()">↪ Logout</button></aside><main class="main"><div class="top"><div><div class="title"><h1 id="title">Dashboard</h1></div><div class="muted" id="desc">Live Supabase control center</div></div><div class="status"><span class="dot"></span><span id="status">Supabase connected</span></div></div><section id="view"></section></main></div><div id="toast"></div><script>const URL="https://timxqulcmqnynhqniwhr.supabase.co",KEY="sb_publishable_-5KdCFbWDJQQUxetnRYBIg_sHXh0Z20";let session=null;const V=document.getElementById('view');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,good=false){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';x.style.borderColor=good?'#28785e':'#8c3b4b';setTimeout(()=>x.style.display='none',4500)}function explain(e){const s=String(e?.message||e||'Unknown error');let r='The server or database rejected the operation.';if(/column|schema cache/i.test(s))r='The deployed code and Supabase database schema do not match.';else if(/401|jwt|session|authentication/i.test(s))r='Your admin session is missing or expired. Sign in again.';else if(/403|admin access/i.test(s))r='You are logged in but your user is not listed in admin_users.';else if(/telegram/i.test(s))r='Telegram delivery cannot complete until a chat ID is linked and the bot can message that user.';else if(/duplicate|unique/i.test(s))r='A record with the same unique value already exists.';else if(/network|fetch/i.test(s))r='The browser could not reach Supabase or the deployed Worker.';return `<div class="error"><strong>⚠ Error</strong><br>${esc(s)}<br><span><b>এর অর্থ:</b> ${esc(r)}</span></div>`}async function sb(path,opt={}){const h={apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),...(opt.headers||{})};if(opt.body)h['Content-Type']='application/json';const r=await fetch(URL+path,{...opt,headers:h});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw Error(d?.message||d?.hint||d?.error_description||`HTTP ${r.status}`);return d}async function login(){const err=document.getElementById('loginErr');err.innerHTML='';try{session=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});const me=await sb('/auth/v1/user');const a=await sb(`/rest/v1/admin_users?select=user_id,email&user_id=eq.${encodeURIComponent(me.id)}&limit=1`);if(!a.length)throw Error('This account is not an Admin.');localStorage.setItem('qx_admin_session',JSON.stringify(session));showApp();load('overview')}catch(e){err.innerHTML=explain(e)}}function restore(){try{const x=JSON.parse(localStorage.getItem('qx_admin_session')||'null');if(x?.access_token){session=x;showApp();load('overview')}}catch{}}function logout(){session=null;localStorage.removeItem('qx_admin_session');location.reload()}function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}function shell(t,d,h){document.getElementById('title').textContent=t;document.getElementById('desc').textContent=d;V.innerHTML=h}function setNav(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}async function count(table){const r=await fetch(`${URL}/rest/v1/${table}?select=*`,{headers:{apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),Prefer:'count=exact',Range:'0-0'}});if(!r.ok)throw Error(await r.text());const cr=r.headers.get('content-range');return cr?Number(cr.split('/')[1]):0}async function load(v){setNav(v);try{if(v==='overview')return overview();if(v==='requests')return requests();if(v==='licenses')return licenses();if(v==='devices')return devices();if(v==='telegram')return telegram();if(v==='candles')return candles();if(v==='market')return market();diagnostics()}catch(e){V.innerHTML=explain(e)}}async function overview(){shell('Dashboard','Live Supabase data and system overview','<div class="grid"><div class="card"><div class="label">Active licenses</div><div class="value" id="a">…</div></div><div class="card"><div class="label">Pending requests</div><div class="value" id="b">…</div></div><div class="card"><div class="label">Devices</div><div class="value" id="c">…</div></div><div class="card"><div class="label">Candle records</div><div class="value" id="d">…</div></div></div><div class="panel"><h2>System Health</h2><div class="success">● Supabase connection active — live data is being read from your existing tables.</div></div><div class="panel"><h2>Database Tables</h2><div id="tables">Loading…</div></div>');const [al,p,dev,can]=await Promise.all([count('licenses'),count('license_registrations'),count('devices'),count('candles')]);a.textContent=al;b.textContent=p;c.textContent=dev;d.textContent=can;tables.innerHTML=['licenses','license_registrations','license_requests','devices','candles','market_data','telegram_chats','admin_users'].map(x=>`<button class="action" onclick="load('${x==='license_registrations'||x==='license_requests'?'requests':x==='market_data'?'market':x==='telegram_chats'?'telegram':x==='admin_users'?'settings':x}")">${x}</button>`).join(' ')}async function tableView(title,desc,table,cols,filter=''){shell(title,desc,`<div class="panel"><div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="tb"><tr><td colspan="${cols.length}" class="empty">Loading…</td></tr></tbody></table></div></div>`);const rows=await sb(`/rest/v1/${table}?select=*${filter}&order=id.desc&limit=100`);document.getElementById('tb').innerHTML=(rows||[]).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'—')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="empty">No records found</td></tr>`}async function requests(){shell('Requests','Incoming license registrations and request history','<div class="panel"><h2>License Registrations</h2><div id="req"></div></div>');try{const rows=await sb('/rest/v1/license_registrations?select=*&order=id.desc&limit=100');req.innerHTML=`<div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Telegram</th><th>Device</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.id}</td><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.telegram||r.telegram_chat_id)}</td><td>${esc(r.device_name||r.device_id)}</td><td><span class="badge">${esc(r.status)}</span></td><td>${r.status==='pending'?`<button class="action ok" onclick="approve(${r.id})">Approve</button> <button class="action danger" onclick="rejectReq(${r.id})">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}catch(e){req.innerHTML=explain(e)}}async function protectedAction(path,id){try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({request_id:Number(id)})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||d.message||`HTTP ${r.status}`);msg(path.includes('approve')?(d.telegram?.ok?'Approved + Telegram sent ✓':'Approved, but Telegram not sent'):'Rejected ✓',true);requests()}catch(e){V.insertAdjacentHTML('beforeend',explain(e))}}function approve(id){protectedAction('/api/approve-license',id)}function rejectReq(id){protectedAction('/api/reject-license',id)}function licenses(){tableView('Licenses','Live data from public.licenses','licenses',['id','license_key','customer_name','customer_email','status','starts_at','expires_at','max_devices'])}function devices(){tableView('Devices','Live device bindings','devices',['id','license_id','device_id','device_name','status','activated_at','last_seen'])}function telegram(){tableView('Telegram','Live Telegram connections','telegram_chats',['id','chat_id','username','first_name','last_name','last_seen_at'])}function candles(){tableView('Candles','Your existing candle dataset — read only','candles',['id','symbol','time','open','high','low','close','color','created_at'])}function market(){tableView('Market Data','Live market_data records','market_data',['id','symbol','time','open','high','low','close','volume','created_at'])}function diagnostics(){shell('Diagnostics','Database and authentication diagnostics','<div class="panel"><h2>Admin session</h2><div class="success">Authenticated admin session is active.</div></div><div class="panel"><h2>Safe controls</h2><p class="muted">Existing Supabase tables are not modified from this page unless an explicit control is used.</p></div>')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>load(b.dataset.v));restore();if(!session){}</script></body></html>
