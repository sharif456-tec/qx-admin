<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QX Admin Control Center</title><style>body{margin:0;background:#06101d;color:#eff8ff;font:14px/1.5 Inter,system-ui,Arial}.login{min-height:100vh;display:grid;place-items:center}.loginbox,.panel,.card{background:#0c1b2c;border:1px solid #1d3b56;border-radius:18px;padding:20px}.hidden{display:none}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:20px;background:#071321;border-right:1px solid #1d3b56}.nav button,.action,.primary{display:block;width:100%;padding:11px;margin:5px 0;background:#123e59;color:#fff;border:1px solid #2b7593;border-radius:10px}.main{padding:25px;max-width:1500px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.value{font-size:28px;font-weight:900}.muted{color:#91abc3}.error{margin-top:12px;padding:13px;border:1px solid #8c3b4b;background:#351923;border-radius:13px}.success{padding:13px;border:1px solid #28785e;background:#10382d;border-radius:13px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #18324a}input{width:100%;padding:12px;margin:7px 0 13px;background:#071625;color:#fff;border:1px solid #27445d;border-radius:10px;box-sizing:border-box}@media(max-width:900px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><div id="loginScreen" class="login"><div class="loginbox"><h2>QX ADMIN</h2><div class="muted">Secure Control Center</div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="primary" onclick="login()">Sign in</button><div id="loginErr"></div></div></div><div id="appScreen" class="app hidden"><aside class="side"><h2>QX ADMIN</h2><div class="nav"><button onclick="load('overview')">◈ Overview</button><button onclick="load('requests')">📥 Pending Requests</button><button onclick="load('licenses')">🔑 Licenses</button><button onclick="load('devices')">📱 Devices</button><button onclick="load('telegram')">✈ Telegram</button><button onclick="load('candles')">🕯 Candles</button><button onclick="load('market')">📊 Market Data</button></div><button class="action" onclick="logout()">Logout</button></aside><main class="main"><h1 id="title">Dashboard</h1><p id="desc" class="muted">Live Supabase control center</p><section id="view"></section></main></div><script>const URL="https://timxqulcmqnynhqniwhr.supabase.co",KEY="sb_publishable_-5KdCFbWDJQQUxetnRYBIg_sHXh0Z20";let session=null;const V=document.getElementById('view'),loginScreen=document.getElementById('loginScreen'),appScreen=document.getElementById('appScreen'),loginErr=document.getElementById('loginErr');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function explain(e){return `<div class="error"><b>⚠ ${esc(e?.message||e)}</b><br><span class="muted">Supabase connection is preserved.</span></div>`}async function sb(path,opt={}){const h={apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),...(opt.headers||{})};if(opt.body)h['Content-Type']='application/json';const r=await fetch(URL+path,{...opt,headers:h});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw Error(d.message||d.hint||`HTTP ${r.status}`);return d}async function login(){loginErr.innerHTML='';try{session=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const me=await sb('/auth/v1/user');const a=await sb(`/rest/v1/admin_users?select=user_id,email&user_id=eq.${encodeURIComponent(me.id)}&limit=1`);if(!a.length)throw Error('This account is not an Admin.');localStorage.setItem('qx_admin_session',JSON.stringify(session));showApp();load('overview')}catch(e){loginErr.innerHTML=explain(e)}}function restore(){try{const x=JSON.parse(localStorage.getItem('qx_admin_session')||'null');if(x?.access_token){session=x;showApp();load('overview')}}catch{}}function logout(){localStorage.removeItem('qx_admin_session');location.reload()}function showApp(){loginScreen.classList.add('hidden');appScreen.classList.remove('hidden')}function shell(t,d,h){document.getElementById('title').textContent=t;document.getElementById('desc').textContent=d;V.innerHTML=h}async function load(v){try{if(v==='overview')return overview();if(v==='requests')return requests();if(v==='licenses')return tableView('Licenses','Live licenses','licenses',['id','license_key','customer_name','customer_email','status','starts_at','expires_at','max_devices']);if(v==='devices')return tableView('Devices','Live device bindings','devices',['id','license_id','device_id','device_name','status','activated_at','last_seen']);if(v==='telegram')return tableView('Telegram','Live Telegram connections','telegram_chats',['id','chat_id','username','first_name','last_name','last_seen_at']);if(v==='candles')return tableView('Candles','Existing candle dataset','candles',['id','symbol','time','open','high','low','close','color','created_at']);if(v==='market')return market();}catch(e){V.innerHTML=explain(e)}}async function overview(){shell('Dashboard','Live Supabase data','<div class="grid"><div class="card"><div>Active licenses</div><div class="value" id="a">…</div></div><div class="card"><div>Pending requests</div><div class="value" id="b">…</div></div><div class="card"><div>Devices</div><div class="value" id="c">…</div></div><div class="card"><div>Candle records</div><div class="value" id="d">…</div></div></div><div class="panel" style="margin-top:15px"><div class="success">● Supabase connection active</div></div>');const [al,p,dev,can]=await Promise.all([count('licenses','&status=eq.active'),count('license_requests','&status=eq.pending'),count('devices'),count('candles')]);a.textContent=al;b.textContent=p;c.textContent=dev;d.textContent=can}async function count(table,filter=''){const r=await fetch(`${URL}/rest/v1/${table}?select=*${filter}`,{headers:{apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY),Prefer:'count=exact',Range:'0-0'}});if(!r.ok)throw Error(await r.text());const cr=r.headers.get('content-range');return cr?Number(cr.split('/')[1]):0}async function requests(){shell('Pending Requests','Requests from public.license_requests','<div class="panel"><h2>Pending License Requests</h2><div id="req">Loading…</div></div>');try{const rows=await sb('/rest/v1/license_requests?select=*&status=eq.pending&order=created_at.desc&limit=100');document.getElementById('req').innerHTML=rows.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Telegram</th><th>Device</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.telegram||r.telegram_chat_id)}</td><td>${esc(r.device_name||r.device_id)}</td><td>${esc(r.status)}</td><td>${esc(r.created_at)}</td><td><button class="action" onclick="approve('${esc(r.id)}')">Approve</button><button class="action" onclick="rejectReq('${esc(r.id)}')">Reject</button></td></tr>`).join('')}</tbody></table>`:'<div class="muted">No pending requests.</div>'}catch(e){document.getElementById('req').innerHTML=explain(e)}}async function protectedAction(path,id){try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({request_id:id})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||d.message||`HTTP ${r.status}`);requests()}catch(e){V.insertAdjacentHTML('beforeend',explain(e))}}function approve(id){protectedAction('/api/approve-license',id)}function rejectReq(id){protectedAction('/api/reject-license',id)}async function tableView(t,d,table,cols){shell(t,d,'<div class="panel"><div id="tb">Loading…</div></div>');const rows=await sb(`/rest/v1/${table}?select=*&order=id.desc&limit=100`);document.getElementById('tb').innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}async function market(){await tableView('Market Data','Original market_data schema','market_data',['id','asset','bid_price','ask_price','last_price','extra_price','created_at'])}restore();</script></body></html>
