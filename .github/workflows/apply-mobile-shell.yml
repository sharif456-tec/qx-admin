name: Apply mobile shell

on:
  push:
    branches: [main]
    paths:
      - mobile.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject mobile shell loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/mobile.js?v=20260823" defer></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html does not contain </body>')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          print('mobile loader present')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed"
            exit 0
          fi
          git commit -m "Enable native mobile dashboard shell"
          git push
